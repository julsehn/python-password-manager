[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".venv*",
    "node_modules",
    "dist",
    "target",
    "build",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv*", "node_modules", "dist", "target", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]